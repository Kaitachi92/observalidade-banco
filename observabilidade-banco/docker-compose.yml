version: '3.8'

services:
  # Serviço PostgreSQL
  postgres:
    image: postgres:latest
    container_name: northwind-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: minhasenhasecreta
      POSTGRES_DB: northwind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - observability_network
    restart: unless-stopped  # Reinicia automaticamente em falhas

  # Serviço para coletar métricas do PostgreSQL
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest  # Imagem corrigida para uma válida
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://admin:minhasenhasecreta@postgres:5432/northwind?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - postgres
    networks:
      - observability_network
    restart: unless-stopped

  # Serviço Prometheus (para coletar métricas)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - observability_network
    restart: unless-stopped

  # Serviço Grafana (para visualizar as métricas)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: 'admin'
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - observability_network
    restart: unless-stopped

networks:
  observability_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
